train_file: data/train.extxyz
valid_file: null
validation_fraction: 0.1
split_mode: blocked
split_block_size: 25
split_gap: 2
seed: 42

model_save_path: mtace_water.pt
architecture: mtace_v2
r_max: 6.0
l_max: 2
num_radial: 12
hidden_dim: 64
num_layers: 2
correlation_order: 4
correlation_channels: 16
radial_basis_type: bessel
radial_trainable: false
gaussian_width: 0.5
radial_mlp_hidden: 32
radial_mlp_layers: 2
tokenizer_type: physical_shells
num_shells: 32
shell_coupling_mode: conservative
mixer_type: mamba
mamba_dim: 64
mamba_d_state: 16
# mamba_d_conv applies only to mamba_variant: mamba1.
mamba_expand: 2
mamba_bidirectional_tied: false
mamba_variant: mamba3
mamba_headdim: 16
mamba_rope_fraction: 0.5
mamba_a_floor: 0.0001
mamba_chunk_size: 64
mamba_angle_mode: official
mamba_mimo_rank: 4
mamba_backend: auto
ffn_hidden: 128
dropout: 0.01
attention_dropout: 0.0
layer_scale_init: 0.01

epochs: 100
batch_size: 4
optimizer: muon
learning_rate: 0.001
minimum_learning_rate: 0.00001
weight_decay: 0.00001
muon_momentum: 0.95
muon_ns_steps: 5
muon_nesterov: true
muon_ns_coefficients: [3.4445, -4.7750, 2.0315]
muon_eps: 0.0000001
muon_ns_precision: auto
muon_adjust_lr_fn: match_rms_adamw
muon_parameter_mode: hidden
muon_include: []
muon_exclude: []
muon_aux_betas: [0.9, 0.95]
muon_aux_eps: 0.0000000001
clip_grad_norm: 10.0
early_stopping_patience: 20
precompute_neighbors: true
device: cpu

solve_atomic_energies: false
atomic_energies: {H: 0.0, O: 0.0}
energy_weight: 1.0
forces_weight: 1.0
stress_weight: 0.0
